[package]
name = "xmip-core-transport-azure-event-grid"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-azure-event-grid"
description = "Azure Event Grid transport: a topic key over the REST API — publish a Stream as one wire event to a topic, receive as the webhook a subscription delivers to, answering the validation handshake — a topic endpoint is a Location. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The endpoint parser, the request and its answer, and TLS
# behind the `tls` feature — one TLS stack in the estate, the http
# technology's (ADR-0033).
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main", optional = true }
# HTTP/1.1 on the wire (`net::http`) and the URL an endpoint is
# (`net::Endpoint`): the one codec every technology riding on HTTP calls.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", optional = true }
# The far end's key compared in constant time (`codec::constant_time`).
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }
# The API answers in JSON, and serde reads it.
serde_json = { version = "1", optional = true }
# The WireEvent a Stream travels in — its attributes, its JSON format,
# data_base64 for bytes — is the event capability's, written and read
# there once (ADR-0065 clause 3). This crate carried a second one until
# 2026-09-26. A Technology may depend on Foundation (repository-model.md
# section 4).
event = { package = "xmip-core-event", git = "https://github.com/IlleNilsson/xmip-core-event", branch = "main", optional = true }
# The identity a published event carries, minted by the estate's one
# generator, and the settings this technology declares (xcore::settings).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[dev-dependencies]
# A Location's secret held in memory (`transport::secured::Kept`), from the
# capability's test support and never a production build (ADR-0044).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }

[features]
# The technology: its code, everything it is built on, and its declaration.
# Without it the crate is its declaration alone (ADR-0064, amendments
# 2026-10-22 and 2026-11-26).
default = ["declaration", "dep:http", "dep:net", "dep:codec", "dep:serde_json", "dep:event"]
# The declaration alone: what a Location of this technology is configured
# with, `declaration::SETTINGS` and `SCHEMES`, and none of
# the code — what the surfaces' library is to carry (open problem 48).
declaration = []
# HTTPS endpoints. Off by default, as it is in the http technology; the
# technology's code, so the default with it.
tls = ["default", "http/tls"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
